version: 1
applications:
  - appRoot: apps/dashboard
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@9.15.0 --activate
            - cd ../.. && pnpm install --frozen-lockfile
        build:
          commands:
            - |
              set -euxo pipefail
              cd ../..
              pnpm --filter @signage/dashboard build
              echo "=== apps/dashboard/.next/ ==="
              ls -la apps/dashboard/.next/ || true
              echo "=== apps/dashboard/.next/standalone/ ==="
              ls -la apps/dashboard/.next/standalone/ || true
              echo "=== apps/dashboard/.next/standalone/apps/dashboard/ ==="
              ls -la apps/dashboard/.next/standalone/apps/dashboard/ || true
              cp -r apps/dashboard/.next/static apps/dashboard/.next/standalone/apps/dashboard/.next/static
              cp -r apps/dashboard/public apps/dashboard/.next/standalone/apps/dashboard/public
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - ../../.pnpm-store/**/*
          - .next/cache/**/*
