version: 1
applications:
  - appRoot: apps/dashboard
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@9.15.0 --activate
            - cd ../.. && rm -rf node_modules apps/*/node_modules packages/*/node_modules
            - cd ../.. && pnpm install --frozen-lockfile
            - cd ../.. && echo "===node_modules/next exists?===" && ls -la node_modules/next/dist/bin/next 2>&1
            - cd ../.. && echo "===node_modules/.bin/next exists?===" && ls -la node_modules/.bin/next 2>&1 || true
        build:
          commands:
            - node ../../node_modules/next/dist/bin/next build
            - mkdir -p .next/standalone/apps/dashboard/.next
            - cp -r .next/static .next/standalone/apps/dashboard/.next/static
            - cp -r public .next/standalone/apps/dashboard/public
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../.pnpm-store/**/*
          - .next/cache/**/*
