version: 1
applications:
  - appRoot: apps/dashboard
    frontend:
      phases:
        preBuild:
          commands:
            - |
              set -e
              corepack enable
              corepack prepare pnpm@9.15.0 --activate
              ROOT="$(git rev-parse --show-toplevel)"
              echo "repo root: $ROOT"
              cd "$ROOT"
              rm -rf node_modules apps/*/node_modules packages/*/node_modules
              pnpm install --frozen-lockfile
              echo "===node binary check==="
              ls -la "$ROOT/node_modules/next/dist/bin/next" || echo "MISSING: next CLI"
              ls -la "$ROOT/node_modules/.bin/next" || echo "MISSING: .bin/next symlink"
        build:
          commands:
            - |
              set -e
              ROOT="$(git rev-parse --show-toplevel)"
              cd "$ROOT/apps/dashboard"
              node "$ROOT/node_modules/next/dist/bin/next" build
              mkdir -p .next/standalone/apps/dashboard/.next
              cp -r .next/static .next/standalone/apps/dashboard/.next/static
              cp -r public .next/standalone/apps/dashboard/public
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../.pnpm-store/**/*
          - .next/cache/**/*
