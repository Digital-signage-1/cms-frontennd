<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>SignageOS Player</title>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="unsupported" style="display:none;background:#000;color:#fff;width:100%;height:100%;position:fixed;top:0;left:0;align-items:center;justify-content:center;font-family:sans-serif;text-align:center;padding:2rem;">
      <p style="font-size:1.5rem;margin-bottom:1rem;">Browser Not Supported</p>
      <p>This player requires Chrome 51 or newer. Please update your device browser.</p>
    </div>
    <script>
      // Show fallback if browser is too old for both module and nomodule scripts
      (function() {
        try {
          // Test for basic ES2015 features needed by the legacy bundle
          new Function('var f = () => {}; var p = Promise.resolve();');
        } catch(e) {
          var el = document.getElementById('unsupported');
          if (el) { el.style.display = 'flex'; }
          var root = document.getElementById('root');
          if (root) { root.style.display = 'none'; }
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
